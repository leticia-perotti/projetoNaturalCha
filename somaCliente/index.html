<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Produtos</title>
    <style>
        :root {
            --primary-color: #ad8a49;
            --primary-dark: #5f430e;
            --text-dark: #333;
            --text-light: #666;
            --text-muted: #999;
            --border-color: #e0e0e0;
            --bg-light: #f5f5f5;
            --error-color: #ff5c5c;
            --error-dark: #e04b4b;
            --spacing: 15px;
            --radius: 5px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--primary-color);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 20px;
        }

        .header h1 {
            color: var(--text-dark);
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-light);
            font-size: 14px;
        }

        .form-section {
            margin-bottom: 20px;
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: var(--primary-color);
            color: white;
        }

        th {
            padding: var(--spacing);
            text-align: left;
            font-weight: 600;
            border: none;
        }

        td {
            padding: var(--spacing);
            border-bottom: 1px solid var(--border-color);
        }

        tbody tr:hover {
            background: var(--bg-light);
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: var(--radius);
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(173, 138, 73, 0.3);
        }

        .row-number {
            text-align: center;
            color: var(--text-muted);
            font-weight: 600;
        }

        .total-section {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
            padding-top: 20px;
            border-top: 2px solid var(--border-color);
        }

        .total-box {
            background: var(--bg-light);
            padding: 20px;
            border-radius: 8px;
            min-width: 300px;
            border-left: 4px solid var(--primary-color);
        }

        .total-label {
            font-size: 16px;
            color: var(--text-light);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .total-value {
            font-size: 32px;
            color: var(--primary-color);
            font-weight: bold;
            text-align: right;
        }

        .buttons-section {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-print {
            background: var(--primary-color);
            color: white;
        }

        .btn-print:hover {
            background: var(--primary-dark);
            box-shadow: 0 5px 15px rgba(95, 67, 14, 0.4);
        }

        .btn-clear {
            background: var(--border-color);
            color: var(--text-dark);
        }

        .btn-clear:hover {
            background: #d0d0d0;
        }

        .btn-delete {
            width: 100%;
            background: var(--error-color);
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: 8px 10px;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-delete:hover {
            background: var(--error-dark);
        }

        .delete-cell {
            text-align: center;
        }

        .product-list {
            padding-top: 10px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-evenly;
            color: var(--text-light);
            font-size: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .header h1 {
                font-size: 20px;
            }

            th, td {
                padding: 10px;
                font-size: 13px;
            }

            .buttons-section {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .product-list {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Natural Chá</h1>
            <p>Preencha a descrição e o valor dos produtos. Pressione TAB na última coluna para adicionar uma nova linha.</p>
            <div class="product-list">
                <span>Produtos:</span>
                <span>1 - À Granel</span>
                <span>2 - Embalagens</span>
                <span>3 - Chocolate</span>
                <span>4 - Chantilly</span>
                <span>5 - Diversos</span>
            </div>
        </div>

        <div class="form-section">
            <div class="table-container">
                <table id="productTable">
                    <thead>
                        <tr>
                            <th style="width: 4%;">#</th>
                            <th style="width: 10%;">Produto</th>
                            <th style="width: 35%;">Descrição</th>
                            <th style="width: 10%;">Qtd.</th>
                            <th style="width: 15%;">Unitário (R$)</th>
                            <th style="width: 20%;">Total (R$)</th>
                            <th style="width: 5%;">Excluir</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="total-section">
            <div class="total-box">
                <div class="total-label">TOTAL:</div>
                <div class="total-value" id="totalValue">R$ 0,00</div>
            </div>
        </div>

        <div class="buttons-section">
            <button class="btn-clear" onclick="clearForm()">Limpar Formulário</button>
            <button class="btn-print" onclick="printTable()">🖨️ Imprimir</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            PRODUCT_MAP: {
                1: 'À Granel',
                2: 'Embalagens',
                3: 'Chocolate',
                4: 'Chantilly',
                5: 'Diversos'
            }
        };

        class ProductForm {
            constructor() {
                this.tableBody = document.getElementById('tableBody');
                this.totalElement = document.getElementById('totalValue');
                this.setupEventListeners();
                window.addEventListener('load', () => this.addProductRow());
            }

            setupEventListeners() {
                this.tableBody.addEventListener('keydown', (e) => this.handleKeydown(e));
                this.tableBody.addEventListener('input', (e) => this.handleInput(e));
                this.tableBody.addEventListener('blur', (e) => this.handleBlur(e), true);
            }

            handleKeydown(e) {
                const input = e.target;
                if (!input.matches('input')) return;

                const row = input.closest('tr');
                const isProduct = input.classList.contains('produto');

                if (isProduct && !e.shiftKey && this.isNumberKey(e.key)) {
                    //e.preventDefault();
                    row.querySelector('.descricao').value = CONFIG.PRODUCT_MAP[e.key] || '';
                }

                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    this.navigateOrAddRow(row, input);
                } else if (e.key === '*' && !e.shiftKey) {
                    e.preventDefault();
                    this.updateRowTotal(row);
                    this.calculateTotal();
                    setTimeout(() => this.printTable(), 50);
                }
            }

            handleInput(e) {
                const input = e.target;
                if (!input.matches('.quantidade, .unitario')) return;

                const row = input.closest('tr');
                this.updateRowTotal(row);
                this.calculateTotal();
            }

            handleBlur(e) {
                const input = e.target;
                if (!input.matches('.unitario')) return;

                const row = input.closest('tr');
                this.updateRowTotal(row);
                this.calculateTotal();
            }

            isNumberKey(key) {
                return Object.keys(CONFIG.PRODUCT_MAP).includes(key);
            }

            navigateOrAddRow(row, input) {
                const inputs = Array.from(row.querySelectorAll('.produto, .descricao, .quantidade, .unitario'));
                const currentIndex = inputs.indexOf(input);

                if (currentIndex < inputs.length - 1) {
                    inputs[currentIndex + 1].focus();
                } else {
                    this.updateRowTotal(row);
                    this.calculateTotal();
                    this.addProductRow();
                    const newRow = this.tableBody.rows[this.tableBody.rows.length - 1];
                    newRow.querySelector('.produto').focus();
                }
            }

            addProductRow() {
                const rowNumber = this.tableBody.rows.length + 1;
                const row = document.createElement('tr');

                row.innerHTML = `
                    <td class="row-number">${rowNumber}</td>
                    <td><input type="number" class="produto" placeholder="0" min="0" /></td>
                    <td><input type="text" class="descricao" placeholder="Descrição" /></td>
                    <td><input type="number" class="quantidade" placeholder="0,00" min="0" step="0.01" /></td>
                    <td><input type="number" class="unitario" placeholder="0,00" min="0" step="0.01" /></td>
                    <td><input type="number" class="total" placeholder="0,00" min="0" step="0.01" disabled /></td>
                    <td class="delete-cell"><button type="button" class="btn-delete" aria-label="Remover linha">🗑️</button></td>
                `;

                this.tableBody.appendChild(row);

                row.querySelector('.btn-delete').addEventListener('click', (e) => {
                    e.preventDefault();
                    this.removeProductRow(row);
                });
            }

            updateRowTotal(row) {
                const quantidade = parseFloat(row.querySelector('.quantidade').value) || 0;
                const unitario = parseFloat(row.querySelector('.unitario').value) || 0;
                row.querySelector('.total').value = (quantidade * unitario).toFixed(2);
            }

            removeProductRow(row) {
                row.remove();
                this.updateRowNumbers();
                this.calculateTotal();

                if (this.tableBody.rows.length === 0) {
                    this.addProductRow();
                }
            }

            updateRowNumbers() {
                Array.from(this.tableBody.rows).forEach((row, index) => {
                    row.querySelector('.row-number').textContent = index + 1;
                });
            }

            calculateTotal() {
                const total = Array.from(document.querySelectorAll('.total'))
                    .reduce((sum, input) => sum + (parseFloat(input.value) || 0), 0);

                this.totalElement.textContent = 'R$ ' + total.toFixed(2).replace('.', ',');
            }

            clearForm() {
                this.tableBody.innerHTML = '';
                this.totalElement.textContent = 'R$ 0,00';
                this.addProductRow();
            }

            printTable() {
                const products = Array.from(this.tableBody.rows)
                    .map(row => ({
                        description: row.querySelector('.descricao').value.trim(),
                        value: parseFloat(row.querySelector('.total').value) || 0,
                        quantity: parseFloat(row.querySelector('.quantidade').value) || 0,
                        unitValue: parseFloat(row.querySelector('.unitario').value) || 0
                    }))
                    .filter(p => p.value > 0);

                if (products.length === 0) {
                    alert('Nenhum produto para imprimir. Adicione pelo menos um produto com descrição ou valor.');
                    return;
                }

                const total = products.reduce((sum, p) => sum + p.value, 0);
                const data = JSON.stringify({
                    products: products.map(p => ({
                        number: p.quantity + 'x',
                        description: p.description,
                        value: p.value,
                        unitario: p.unitValue
                    })),
                    total
                });

                this.clearForm();
                const encoded = encodeURIComponent(data);
                window.open(`print.html?data=${encoded}`, '_blank');
            }
        }

        const form = new ProductForm();

        function clearForm() {
            form.clearForm();
        }

        function printTable() {
            form.printTable();
        }

        function removeProductRow(button) {
            const row = button.closest('tr');
            form.removeProductRow(row);
        }
    </script>
</body>
</html>
