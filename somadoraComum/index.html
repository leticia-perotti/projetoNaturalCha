<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Calculadora Básica</title>
	<style>
		body {
			background: #f3f4f6;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
		}
		.calculator-app {
			display: flex;
			align-items: flex-start;
			gap: 24px;
			flex-wrap: wrap;
			max-width: 860px;
		}
		.calculator {
			background: #fff;
			padding: 32px 24px 24px 24px;
			border-radius: 18px;
			box-shadow: 0 10px 30px rgba(0,0,0,0.08);
			width: 320px;
		}
		.history {
			background: #ffffff;
			padding: 24px;
			border-radius: 18px;
			box-shadow: 0 10px 30px rgba(0,0,0,0.08);
			width: 320px;
			max-height: 520px;
			overflow: hidden;
			font-family: arial;
		}
		.history-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 14px;
			margin-bottom: 18px;
		}
		.history h2 {
			font-size: 1.1rem;
			margin: 0;
			color: #111827;
		}
		.print-button {
			background: #2563eb;
			color: #fff;
			border: none;
			border-radius: 10px;
			padding: 10px 14px;
			font-size: 0.95rem;
			cursor: pointer;
			transition: background 0.2s;
		}
		.print-button:hover {
			background: #1d4ed8;
		}
		.history-list {
			list-style: none;
			margin: 0;
			padding: 0;
			display: grid;
			gap: 10px;
			max-height: 440px;
			overflow-y: auto;
		}
		.history-list::-webkit-scrollbar {
			width: 6px;
		}
		.history-list::-webkit-scrollbar-thumb {
			background: rgba(37,99,235,0.35);
			border-radius: 999px;
		}
		.history-item {
			background: #f8fafc;
			padding: 12px 14px;
			border-radius: 12px;
			color: #111827;
			font-size: 0.95rem;
			line-height: 1.4;
			box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
		}
		.display {
			background: #222;
			color: #fff;
			font-size: 2.2rem;
			border-radius: 10px;
			padding: 18px 12px;
			margin-bottom: 18px;
			text-align: right;
			min-height: 48px;
			letter-spacing: 1px;
		}
		.buttons {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			gap: 10px;
		}
		.buttons button {
			font-size: 1.2rem;
			padding: 18px 0;
			border-radius: 10px;
			border: none;
			background: #e5e7eb;
			color: #222;
			font-weight: bold;
			cursor: pointer;
			transition: background 0.2s;
		}
		.buttons button:hover {
			background: #2563eb;
			color: #fff;
		}
		.buttons .operator {
			background: #fbbf24;
			color: #222;
		}
		.buttons .operator:hover {
			background: #f59e42;
		}
		.buttons .equals {
			background: #16a34a;
			color: #fff;
		}
		.buttons .equals:hover {
			background: #15803d;
		}
		.buttons .clear {
			background: #ef4444;
			color: #fff;
		}
		.buttons .clear:hover {
			background: #dc2626;
		}
	</style>
</head>
<body>
	<div class="calculator-app">
		<div class="calculator">
			<div id="display" class="display">0</div>
			<div class="buttons">
			<button onclick="inputDigit('7')">7</button>
			<button onclick="inputDigit('8')">8</button>
			<button onclick="inputDigit('9')">9</button>
			<button class="operator" onclick="setOperator('/')">÷</button>

			<button onclick="inputDigit('4')">4</button>
			<button onclick="inputDigit('5')">5</button>
			<button onclick="inputDigit('6')">6</button>
			<button class="operator" onclick="setOperator('*')">×</button>

			<button onclick="inputDigit('1')">1</button>
			<button onclick="inputDigit('2')">2</button>
			<button onclick="inputDigit('3')">3</button>
			<button class="operator" onclick="setOperator('-')">-</button>

			<button onclick="inputDigit('0')">0</button>
			<button onclick="inputDot()">,</button>
			<button class="operator" onclick="setOperator('%')">%</button>
			<button class="operator" onclick="setOperator('+')">+</button>

			<button class="clear" onclick="clearDisplayOnly()">CE</button>
			<button class="clear" onclick="clearAll()">C</button>
			<button class="equals" style="grid-column: span 2" onclick="calculateResult()">=</button>
		</div>
	</div>
	<div class="history">
		<div class="history-header">
			<h2>Histórico de operações</h2>
			<button id="printButton" class="print-button" type="button" onclick="printHistory()">Imprimir</button>
		</div>
		<ul id="historyList" class="history-list">
			<li class="history-item">Nenhuma operação ainda.</li>
		</ul>
	</div>
	</div>
	<script>
		let displayValue = '0';
		let firstOperand = null;
		let waitingForSecondOperand = false;
		let operator = null;
		let historyEntries = [];
		const maxHistoryItems = 6;

		function updateDisplay() {
			document.getElementById('display').innerText = displayValue.replace('.', ',');
		}

		function inputDigit(digit) {
			if (waitingForSecondOperand) {
				displayValue = digit;
				waitingForSecondOperand = false;
			} else {
				displayValue = displayValue === '0' ? digit : displayValue + digit;
			}
			updateDisplay();
		}

		function inputDot() {
			if (!displayValue.includes(',')) {
				displayValue += ',';
			}
			updateDisplay();
		}

		function parseDisplay() {
			return parseFloat(displayValue.replace(',', '.')) || 0;
		}

		function addHistoryEntry(entry) {
			historyEntries.unshift(entry);
			if (historyEntries.length > maxHistoryItems) {
				historyEntries.pop();
			}
			renderHistory();
		}

		function renderHistory() {
			const historyList = document.getElementById('historyList');
			historyList.innerHTML = '';
			if (historyEntries.length === 0) {
				historyList.innerHTML = '<li class="history-item">Nenhuma operação ainda.</li>';
				return;
			}
			historyEntries.forEach(item => {
				const li = document.createElement('li');
				li.className = 'history-item';
				li.textContent = item;
				historyList.appendChild(li);
			});
		}

		function setOperator(nextOperator) {
			if (operator && !waitingForSecondOperand) {
				calculateResult();
			}
			operator = nextOperator;
			firstOperand = parseDisplay();
			waitingForSecondOperand = true;
		}

		function calculateResult() {
			let secondOperand = parseDisplay();
			let result = firstOperand;
			if (operator === null) {
				displayValue = formatNumber(secondOperand);
				updateDisplay();
				return;
			}
			switch (operator) {
				case '+':
					result = firstOperand + secondOperand;
					break;
				case '-':
					result = firstOperand - secondOperand;
					break;
				case '*':
					result = firstOperand * secondOperand;
					break;
				case '/':
					if (secondOperand === 0) {
						displayValue = 'Erro';
						updateDisplay();
						return;
					}
					result = firstOperand / secondOperand;
					break;
				case '%':
					result = firstOperand * (secondOperand / 100);
					break;
				default:
					result = secondOperand;
			}

			if (historyEntries.length === 0){
				const expression = `${formatNumber(firstOperand)}`;
				addHistoryEntry(expression);
			}
			const expression = `${operator} ${formatNumber(secondOperand)} = ${formatNumber(result)}`;
			displayValue = formatNumber(result);
			addHistoryEntry(expression);
			updateDisplay();
			firstOperand = result;
			waitingForSecondOperand = true;
			operator = null;
		}

		function clearDisplayOnly() {
			displayValue = '0';
			updateDisplay();
		}

		function clearAll() {
			displayValue = '0';
			firstOperand = null;
			waitingForSecondOperand = false;
			operator = null;
			historyEntries = [];
			renderHistory();
			updateDisplay();
		}

		function printHistory() {
			if (historyEntries.length === 0) {
				alert('Não há operações no histórico para imprimir.');
				return;
			}

			function parseLocaleNumber(value) {
				return parseFloat(value.replace(/\./g, '').replace(/,/g, '.')) || 0;
			}

			let total = 0;
			const rows = historyEntries.map(entry => {
				const match = entry.match(/=\s*([\d\.\,\-]+)/);
				const resultValue = match ? parseLocaleNumber(match[1]) : 0;
				return {
					expression: entry.split('=')[0].trim(),
					value: resultValue
				};
			});

			total = historyEntries[0].split('=')[1].trim()

            const dataString = JSON.stringify({
                products: rows,
                total: total
            });

			console.log(dataString);

            const encoded = encodeURIComponent(dataString);
            
			clearAll();
            window.open(`print.html?data=${encoded}`, '_blank');
		}

		function formatNumber(num) {
			return num.toLocaleString('pt-BR', { maximumFractionDigits: 10 });
		}

		// Inicialização
		updateDisplay();

		// Teclado físico
		document.addEventListener('keydown', function(e) {
			if (e.key >= '0' && e.key <= '9') {
				inputDigit(e.key);
			} else if (e.key === ',' || e.key === '.') {
				inputDot();
			} else if (e.key === '+') {
				setOperator('+');
			} else if (e.key === '-') {
				setOperator('-');
			} else if (e.key === '*') {
				setOperator('*');
			} else if (e.key === '/') {
				setOperator('/');
			} else if (e.key === '%') {
				setOperator('%');
			} else if (e.key === 'Enter') {
				printHistory();
			} else if (e.key === '=') {
				calculateResult();
			} else if (e.key === 'c' || e.key === 'C') {
				clearAll();
			}
		});
	</script>
</body>
</html>
