<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Calculadora Básica</title>
	<style>
		body {
			background: #f3f4f6;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
		}

		.calculator-app {
			display: flex;
			align-items: flex-start;
			gap: 24px;
			flex-wrap: wrap;
			max-width: 860px;
		}

		.calculator {
			background: #fff;
			padding: 32px 24px 24px 24px;
			border-radius: 18px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
			width: 320px;
		}

		.history {
			background: #ffffff;
			padding: 24px;
			border-radius: 18px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
			width: 320px;
			max-height: 520px;
			overflow: hidden;
			font-family: arial;
		}

		.history-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 14px;
			margin-bottom: 18px;
		}

		.history h2 {
			font-size: 1.1rem;
			margin: 0;
			color: #111827;
		}

		.print-button {
			background: #2563eb;
			color: #fff;
			border: none;
			border-radius: 10px;
			padding: 10px 14px;
			font-size: 0.95rem;
			cursor: pointer;
			transition: background 0.2s;
		}

		.print-button:hover {
			background: #1d4ed8;
		}

		.history-list {
			list-style: none;
			margin: 0;
			padding: 0;
			display: grid;
			gap: 10px;
			max-height: 440px;
			overflow-y: auto;
		}

		.history-list::-webkit-scrollbar {
			width: 6px;
		}

		.history-list::-webkit-scrollbar-thumb {
			background: rgba(37, 99, 235, 0.35);
			border-radius: 999px;
		}

		.history-item {
			background: #f8fafc;
			padding: 12px 14px;
			border-radius: 12px;
			color: #111827;
			font-size: 0.95rem;
			line-height: 1.4;
			box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
		}

		.display {
			background: #222;
			color: #fff;
			font-size: 2.2rem;
			border-radius: 10px;
			padding: 18px 12px;
			margin-bottom: 12px;
			text-align: right;
			min-height: 48px;
			letter-spacing: 1px;
		}

		.total-display {
			background: #1f2937;
			color: #60a5fa;
			font-size: 1rem;
			border-radius: 10px;
			padding: 10px 12px;
			margin-bottom: 18px;
			text-align: right;
			min-height: 32px;
			letter-spacing: 0.5px;
			border: 1px solid #374151;
			font-weight: bold;
		}

		.buttons {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			gap: 10px;
		}

		.buttons button {
			font-size: 1.2rem;
			padding: 18px 0;
			border-radius: 10px;
			border: none;
			background: #e5e7eb;
			color: #222;
			font-weight: bold;
			cursor: pointer;
			transition: background 0.2s;
		}

		.buttons button:hover {
			background: #2563eb;
			color: #fff;
		}

		.buttons .operator {
			background: #fbbf24;
			color: #222;
		}

		.buttons .operator:hover {
			background: #f59e42;
		}

		.buttons .equals {
			background: #16a34a;
			color: #fff;
		}

		.buttons .equals:hover {
			background: #15803d;
		}

		.buttons .clear {
			background: #ef4444;
			color: #fff;
		}

		.buttons .clear:hover {
			background: #dc2626;
		}
	</style>
</head>

<body>
	<div class="calculator-app">
		<div class="calculator">
			<div id="display" class="display">0</div>
			<div class="buttons">
				<button onclick="inputDigit('7')">7</button>
				<button onclick="inputDigit('8')">8</button>
				<button onclick="inputDigit('9')">9</button>
				<button class="operator" onclick="setOperator('/')">÷</button>

				<button onclick="inputDigit('4')">4</button>
				<button onclick="inputDigit('5')">5</button>
				<button onclick="inputDigit('6')">6</button>
				<button class="operator" onclick="setOperator('*')">×</button>

				<button onclick="inputDigit('1')">1</button>
				<button onclick="inputDigit('2')">2</button>
				<button onclick="inputDigit('3')">3</button>
				<button class="operator" onclick="setOperator('-')">-</button>

				<button onclick="inputDigit('0')">0</button>
				<button onclick="inputDot()">,</button>
				<button class="operator" onclick="applyPercentage()">%</button>
				<button class="operator" onclick="setOperator('+')">+</button>

				<button class="clear" onclick="clearDisplayOnly()">CE</button>
				<button class="clear" onclick="clearAll()">C</button>
				<button class="equals" style="grid-column: span 2" onclick="calculateResult()">=</button>
			</div>
		</div>
		<div class="history">
			<div class="history-header">
				<h2>Histórico de operações</h2>
				<button id="printButton" class="print-button" type="button" onclick="printHistory()">Imprimir</button>
			</div>
			<ul id="historyList" class="history-list">
				<li class="history-item">Nenhuma operação ainda.</li>
			</ul>
		</div>
	</div>
	<script>
		class CalculatorState {
			constructor() {
				this.displayValue = '0';
				this.accumulator = null;
				this.originalValue = null;
				this.currentOperator = null;
				this.justCalculated = false;
				this.historyEntries = [];
				this.MAX_HISTORY_ITEMS = 6;
			}

			reset() {
				this.displayValue = '0';
				this.accumulator = null;
				this.originalValue = null;
				this.currentOperator = null;
				this.justCalculated = false;
			}

			clearHistory() {
				this.historyEntries = [];
				this.reset();
			}

			addHistoryEntry(entry) {
				this.historyEntries.unshift(entry);
				if (this.historyEntries.length > this.MAX_HISTORY_ITEMS) {
					this.historyEntries.pop();
				}
			}
		}

		class CalculatorEngine {
			constructor(state) {
				this.state = state;
			}

			parseDisplay() {
				return parseFloat(this.state.displayValue.replace(',', '.')) || 0;
			}

			formatNumber(num) {
				return num.toLocaleString('pt-BR', { maximumFractionDigits: 10 });
			}

			performCalculation(first, second, op) {
				const operations = {
					'+': (a, b) => a + b,
					'-': (a, b) => a - b,
					'*': (a, b) => a * b,
					'/': (a, b) => b === 0 ? null : a / b,
					'%': (a, b) => a * (b / 100)
				};
				return operations[op]?.(first, second) ?? second;
			}

			isValidDivision(second) {
				return second !== 0;
			}

			getTotalForPrint() {
				return this.formatNumber(this.parseDisplay());
			}
		}

		class CalculatorUI {
			constructor(state, engine) {
				this.state = state;
				this.engine = engine;
			}

			updateDisplay() {
				document.getElementById('display').innerText = this.state.displayValue.replace('.', ',');
			}

			renderHistory() {
				const historyList = document.getElementById('historyList');
				historyList.innerHTML = '';
				if (this.state.historyEntries.length === 0) {
					historyList.innerHTML = '<li class="history-item">Nenhuma operação ainda.</li>';
					return;
				}
				this.state.historyEntries.forEach(item => {
					const li = document.createElement('li');
					li.className = 'history-item';
					li.textContent = item;
					historyList.appendChild(li);
				});
			}

			inputDigit(digit) {
				if (this.state.justCalculated) {
					this.state.displayValue = digit;
					this.state.justCalculated = false;
					this.state.originalValue = parseFloat(digit);
				} else {
					this.state.displayValue = this.state.displayValue === '0' ? digit : this.state.displayValue + digit;
				}
				this.updateDisplay();
			}

			inputDot() {
				if (!this.state.displayValue.includes('.') && !this.state.displayValue.includes(',')) {
					this.state.displayValue += '.';
				}
				this.updateDisplay();
			}

			setOperator(op) {
				const currentValue = this.engine.parseDisplay();

				if (this.state.accumulator === null) {
					this.state.accumulator = currentValue;
					this.state.originalValue = currentValue;
					const expression = `${this.engine.formatNumber(currentValue)}`;
					this.state.addHistoryEntry(expression);
					this.renderHistory();
				} else if (this.state.justCalculated && this.state.currentOperator) {
					let result = this.engine.performCalculation(this.state.accumulator, this.state.originalValue, this.state.currentOperator);
					const expression = ` ${this.state.currentOperator} ${this.engine.formatNumber(this.state.originalValue)}`;
					this.state.addHistoryEntry(expression);
					this.renderHistory();

					this.state.accumulator = result;
					this.state.displayValue = this.engine.formatNumber(result);
					this.updateDisplay();
				} else {
					let result = this.engine.performCalculation(this.state.accumulator, currentValue, this.state.currentOperator);
					const expression = ` ${this.state.currentOperator} ${this.engine.formatNumber(currentValue)}`;
					this.state.addHistoryEntry(expression);
					this.renderHistory();

					this.state.accumulator = result;
					this.state.originalValue = currentValue;
					this.state.displayValue = this.engine.formatNumber(result);
					this.updateDisplay();
				}

				this.state.currentOperator = op;
				this.state.justCalculated = true;
			}

			applyPercentage() {
				const currentValue = this.engine.parseDisplay();

				if (this.state.accumulator !== null && this.state.currentOperator !== null) {
					const percentageOps = {
						'*': (acc, val) => acc * (1 + val / 100),
						'+': (acc, val) => acc + (acc * val / 100),
						'-': (acc, val) => acc - (acc * val / 100),
						'/': (acc, val) => acc / (val / 100)
					};
					const result = percentageOps[this.state.currentOperator]?.(this.state.accumulator, currentValue) ?? currentValue;
					this.state.displayValue = this.engine.formatNumber(result);
					const expression = `${this.engine.formatNumber(this.state.accumulator)} ${this.state.currentOperator} ${this.engine.formatNumber(currentValue)}%`;
					this.state.addHistoryEntry(expression);
					this.renderHistory();
					this.state.accumulator = this.engine.parseDisplay();
					this.state.currentOperator = null;
					this.state.originalValue = null;
				} else {
					this.state.displayValue = this.engine.formatNumber(currentValue / 100);
				}
				this.state.justCalculated = true;
				this.updateDisplay();
			}

			calculateResult() {
				if (this.state.currentOperator === null) return;

				let result;
				const currentValue = this.engine.parseDisplay();

				if (this.state.justCalculated) {
					result = this.state.accumulator;
					const expression = `${this.engine.formatNumber(this.state.accumulator)} ${this.state.currentOperator} ${this.engine.formatNumber(this.state.originalValue)}`;
					this.state.addHistoryEntry(expression);
					this.renderHistory();
				} else {
					result = currentValue === 0 && this.state.displayValue === '0'
						? this.state.accumulator
						: this.engine.performCalculation(this.state.accumulator, currentValue, this.state.currentOperator);
					const expression = `${this.engine.formatNumber(this.state.accumulator)} ${this.state.currentOperator} ${this.engine.formatNumber(currentValue)}`;
					this.state.addHistoryEntry(expression);
					this.renderHistory();
				}

				this.state.displayValue = this.engine.formatNumber(result);
				this.updateDisplay();

				this.state.accumulator = this.engine.parseDisplay();
				this.state.currentOperator = null;
				this.state.originalValue = null;
				this.state.justCalculated = true;
			}

			clearDisplayOnly() {
				this.state.reset();
				this.updateDisplay();
			}

			clearAll() {
				this.state.clearHistory();
				this.renderHistory();
				this.updateDisplay();
			}

			printHistory() {
				if (this.state.historyEntries.length === 0) {
					alert('Não há operações no histórico para imprimir.');
					return;
				}

				const rows = this.state.historyEntries.map(entry => ({
					expression: entry.split('=')[0].trim(),
					value: entry
				}));

				console.log('Preparando dados para impressão:', rows);
				console.log('Total para impressão:', this.state.historyEntries);

				const dataString = JSON.stringify({
					products: rows.reverse(),
					total: this.engine.getTotalForPrint()
				});

				const encoded = encodeURIComponent(dataString);
				this.clearAll();
				window.open(`print.html?data=${encoded}`, '_blank');
			}
		}

		const state = new CalculatorState();
		const engine = new CalculatorEngine(state);
		const ui = new CalculatorUI(state, engine);

		function inputDigit(digit) { ui.inputDigit(digit); }
		function inputDot() { ui.inputDot(); }
		function setOperator(op) { ui.setOperator(op); }
		function applyPercentage() { ui.applyPercentage(); }
		function calculateResult() { ui.calculateResult(); }
		function clearDisplayOnly() { ui.clearDisplayOnly(); }
		function clearAll() { ui.clearAll(); }
		function printHistory() { ui.printHistory(); }

		ui.updateDisplay();

		document.addEventListener('keydown', (e) => {
			if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
			else if (e.key === ',' || e.key === '.') inputDot();
			else if (['+', '-', '*', '/'].includes(e.key)) setOperator(e.key);
			else if (e.key === '%') applyPercentage();
			else if (e.key === 'Enter') { e.preventDefault(); calculateResult(); }
			else if (e.key === '=' || e.key === '+') calculateResult();
			else if (e.key === 'c' || e.key === 'C') clearAll();
			else if (e.key === 'p' || e.key === 'P' || e.key === ' ') printHistory();
		});
	</script>
</body>

</html>
